name: Bug Report
description: Report a bug that occurred in IN-Q V2
title: "[Bug] "
labels:
- bug
body:
- type: markdown
  attributes:
    value: |
      Thank you for your report. The issue contents and attached files will be public on the internet.
      Please do not post personal information, Steam credentials, save data, IP addresses, etc.

- type: input
  id: inq_version
  attributes:
    label: IN-Q Version
    description: Enter the version displayed on the IN-Q screen.
    placeholder: "Example: 0.4.42"
  validations:
    required: true

- type: input
  id: mhw_build
  attributes:
    label: MHW Version or Build
    placeholder: "Example: 421810"
  validations:
    required: true

- type: dropdown
  id: play_mode
  attributes:
    label: Play Environment
    options:
    - Solo
    - Multiplayer (Host)
    - Multiplayer (Guest)
    - Unknown
  validations:
    required: true

- type: input
  id: quest_id
  attributes:
    label: Quest ID
    description: Only enter if known.
    placeholder: "Example: 66845"

- type: textarea
  id: summary
  attributes:
    label: Bug Summary
    description: Briefly describe what happened.
  validations:
    required: true

- type: textarea
  id: steps
  attributes:
    label: Steps to Reproduce
    description: List the steps leading up to the bug in order.
    placeholder: |
      1. Launch MHW and IN-Q
      2. Select a quest
      3. Perform a restart
  validations:
    required: true

- type: textarea
  id: expected
  attributes:
    label: Expected Result
  validations:
    required: true

- type: textarea
  id: actual
  attributes:
    label: Actual Result
  validations:
    required: true

- type: dropdown
  id: frequency
  attributes:
    label: Reproduction Rate
    options:
    - Every time
    - High probability
    - Sometimes
    - Only once
    - Not reproduced
  validations:
    required: true

- type: textarea
  id: mods
  attributes:
    label: Installed Mods
    description: If a conflict is suspected, list them within a shareable scope.

- type: textarea
  id: logs
  attributes:
    label: Diagnostic Log
    description: Paste the public diagnostic log generated by IN-Q. Please review the contents before posting.
    render: text

- type: checkboxes
  id: public_confirmation
  attributes:
    label: Confirmation of Public Content
    options:
    - label: I have confirmed that the post contents and logs do not contain personal information, credentials, or save data.
      required: true

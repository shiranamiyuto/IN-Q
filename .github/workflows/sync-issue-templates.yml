
name: Sync Issue Templates

on:
  push:
    branches:
      - main
    paths:
      - ".github/ISSUE_TEMPLATE/bug-report-ja.yml"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/sync-issue-templates.yml"

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY is not configured."
            exit 1
          fi

          if [ -z "$GEMINI_MODEL" ]; then
            echo "::error::GEMINI_MODEL is not configured."
            exit 1
          fi

      - name: Generate translated templates
        env:
          TRANSLATOR_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          python scripts/sync_issue_templates.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/update-issue-templates
          base: ${{ github.ref_name }}
          delete-branch: true
          draft: true
          commit-message: "chore: update translated issue templates"
          title: "不具合報告テンプレートの翻訳を更新"
          body: |
            このPRには、日本語版のIssueテンプレートをもとに
            自動生成した英語版・中国語（簡体字）版の更新が含まれています。

            マージ前に、翻訳内容とテンプレートの構成をご確認ください。

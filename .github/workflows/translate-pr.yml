name: Translate Pull Request

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened

permissions:
  pull-requests: write
  issues: write

jobs:
  translate-pr:
    if: >-
      github.event.pull_request.head.ref != 'automation/update-issue-templates' &&
      (
        github.event.action != 'edited' ||
        github.event.changes.title != null ||
        github.event.changes.body != null
      )

    runs-on: ubuntu-latest

    steps:
      - name: Debug pull request event context
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_ACTION: ${{ github.event.action }}
        run: |
          echo "Event: $EVENT_NAME"
          echo "Base repository: $BASE_REPOSITORY"
          echo "Head repository: $HEAD_REPOSITORY"
          echo "Head branch: $HEAD_REF"
          echo "PR action: $PR_ACTION"

      - name: Checkout base repository default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY is not configured."
            exit 1
          fi

          if [ -z "$GEMINI_MODEL" ]; then
            echo "::error::GEMINI_MODEL is not configured."
            exit 1
          fi

      - name: Translate pull request and sync comment
        env:
          TRANSLATOR_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m scripts.translate_pr_event

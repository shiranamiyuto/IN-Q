name: 不具合報告
description: IN-Q V2で発生した不具合を報告します
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        報告ありがとうございます。Issueの内容と添付ファイルはインターネット上で公開されます。
        個人情報、Steam認証情報、セーブデータ、IPアドレスなどは投稿しないでください。

  - type: input
    id: inq_version
    attributes:
      label: IN-Qのバージョン
      description: IN-Qの画面に表示されているバージョンを入力してください。
      placeholder: 例: 0.4.42
    validations:
      required: true

  - type: input
    id: mhw_build
    attributes:
      label: MHWのバージョンまたはビルド
      placeholder: 例: 421810
    validations:
      required: true

  - type: dropdown
    id: play_mode
    attributes:
      label: プレイ環境
      options:
        - ソロ
        - マルチ・ホスト
        - マルチ・ゲスト
        - 不明
    validations:
      required: true

  - type: input
    id: quest_id
    attributes:
      label: クエストID
      description: 分かる場合だけ入力してください。
      placeholder: 例: 66845

  - type: textarea
    id: summary
    attributes:
      label: 不具合の概要
      description: 何が起きたかを簡潔に説明してください。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 不具合が起きるまでの操作を順番に記載してください。
      placeholder: |
        1. MHWとIN-Qを起動する
        2. クエストを選択する
        3. 再スタートを実行する
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待した結果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の結果
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: 再現率
      options:
        - 毎回
        - 高確率
        - ときどき
        - 1回だけ
        - 再現できていない
    validations:
      required: true

  - type: textarea
    id: mods
    attributes:
      label: 導入しているMOD
      description: 競合が疑われる場合に、公開してよい範囲で記載してください。

  - type: textarea
    id: logs
    attributes:
      label: 診断ログ
      description: IN-Qが生成した公開用診断ログを貼り付けてください。投稿前に内容を確認してください。
      render: text

  - type: checkboxes
    id: public_confirmation
    attributes:
      label: 公開内容の確認
      options:
        - label: 投稿内容とログに個人情報、認証情報、セーブデータが含まれていないことを確認しました。
          required: true

name: Translate Pull Request

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened

concurrency:
  group: translate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  pull-requests: write
  issues: read

jobs:
  translate-pr:
    if: >-
      github.event.pull_request.head.ref != 'automation/update-issue-templates' &&
      github.event.pull_request.head.ref != 'automation/update-translated-documents' &&
      (
        github.event.action != 'edited' ||
        github.event.changes.title != null ||
        github.event.changes.body != null
      )

    runs-on: ubuntu-latest

    steps:
      - name: Checkout base repository default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY is not configured."
            exit 1
          fi

          if [ -z "$GEMINI_MODEL" ]; then
            echo "::error::GEMINI_MODEL is not configured."
            exit 1
          fi

      - name: Translate pull request and sync comment
        env:
          TRANSLATOR_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m scripts.translate_pr_event

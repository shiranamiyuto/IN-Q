name: Sync Translated Documents

on:
  push:
    branches:
      - multi-language-support
    paths:
      - "README.md"
      - "PRIVACY.md"
      - "scripts/sync_documents.py"
      - "scripts/translators.py"
      - "requirements.txt"
      - ".github/workflows/sync-documents.yml"

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-translated-documents
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY is not configured."
            exit 1
          fi

          if [ -z "$GEMINI_MODEL" ]; then
            echo "::error::GEMINI_MODEL is not configured."
            exit 1
          fi

      - name: Generate translated documents
        env:
          TRANSLATOR_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          python -m scripts.sync_documents

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/update-translated-documents
          base: ${{ github.event.repository.default_branch }}
          delete-branch: true
          title: "翻訳ドキュメントを更新"
          body: |
            日本語の README.md と PRIVACY.md をもとに、英語版と簡体字中国語版を自動生成しました。

            ## 確認事項

            - README の翻訳内容とリンクを確認してください。
            - PRIVACY の翻訳内容が日本語原文の意味を正確に反映しているか確認してください。
            - PRIVACY はユーザーデータの取り扱いに関する公開文書です。翻訳の正確性と実際のソフトウェアの動作を必ず人手で確認してください。

            問題がなければ、この PR をマージしてください。
          commit-message: "chore: update translated documents"
